<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Joko Comia, UI/UX Designer and Front-end Developer</title>
  <desc id="d">Joko Comia, UI/UX designer and front-end developer, open to OJT in San Pablo City, Laguna. A wireframe card draws itself, a cursor selects its button, and the matching code appears.</desc>
  <style>
    @font-face { font-family: "Funnel Display"; font-weight: 800; font-style: normal; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Funnel Sans"; font-weight: 600; font-style: normal; src: url(data:font/woff2;base64,) format("woff2"); }
    .disp { font-family: "Funnel Display", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .sans { font-family: "Funnel Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 600; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .rule { stroke-dasharray: 888; stroke-dashoffset: 0; animation: draw .9s ease-out both; }
    .outline { stroke-dasharray: 836; stroke-dashoffset: 0; animation: draw 1s ease-out .5s both; }
    .up { animation: up .9s cubic-bezier(.16,.84,.3,1) both; }
    .n { --y: 130px; animation-delay: .1s; }
    .r1 { --y: 44px; animation-delay: .35s; animation-duration: .7s; }
    .r2 { --y: 44px; animation-delay: .45s; animation-duration: .7s; }
    .fade { animation: fade .45s ease-out both; }
    .inner { animation-delay: 1.2s; }
    .pick { animation-delay: 2.3s; }
    .fill { animation-delay: 2.6s; }
    .code { animation-delay: 2.9s; }
    .cursor { animation: move .9s cubic-bezier(.45,0,.2,1) 1.4s both; }
    @keyframes draw { from { stroke-dashoffset: 888; } to { stroke-dashoffset: 0; } }
    @keyframes up { from { transform: translateY(var(--y)); } to { transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes move { 0% { opacity: 0; transform: translate(-130px,-110px); } 15% { opacity: 1; } 100% { opacity: 1; transform: translate(0,0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
