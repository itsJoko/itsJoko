<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Joko Comia, UI/UX Designer and Front-end Developer</title>
  <desc id="d">A blueprint-style banner. A wireframe card draws itself, its button is selected and filled in, and the matching code appears underneath.</desc>
  <style>
    .sans { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
    .draw { stroke-dasharray: 996; stroke-dashoffset: 0; animation: draw 1s ease-out both; }
    .fade { animation: fade .5s ease-out both; }
    .a1 { animation-delay: .6s; }
    .a2 { animation-delay: 1.3s; }
    .a3 { animation-delay: 1.7s; }
    .a4 { animation-delay: 2.1s; }
    @keyframes draw { from { stroke-dashoffset: 996; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#F2F5FF" stroke-opacity=".07"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#F2F5FF" stroke-opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="16" fill="#16247A"/>
  <rect width="1000" height="300" rx="16" fill="url(#minor)"/>
  <rect width="1000" height="300" rx="16" fill="url(#major)"/>

  <text class="sans" x="56" y="132" font-size="76" font-weight="800" letter-spacing="-2" fill="#F2F5FF">Joko Comia</text>
  <text class="sans" x="58" y="190" font-size="34" font-weight="600" fill="#F2F5FF">UI/UX Designer &amp;</text>
  <text class="sans" x="58" y="232" font-size="34" font-weight="600" fill="#F2F5FF">Front-end Developer</text>

  <rect class="draw" x="650" y="40" width="290" height="220" rx="14" fill="none" stroke="#F2F5FF" stroke-width="2"/>

  <g class="fade a1">
    <rect x="670" y="60" width="250" height="84" rx="8" fill="none" stroke="#F2F5FF" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M670 60L920 144M920 60L670 144" stroke="#F2F5FF" stroke-opacity=".25" stroke-width="1.5"/>
    <rect x="670" y="164" width="180" height="10" rx="5" fill="#F2F5FF" fill-opacity=".7"/>
    <rect x="670" y="184" width="120" height="10" rx="5" fill="#F2F5FF" fill-opacity=".4"/>
  </g>

  <rect x="670" y="212" width="120" height="30" rx="15" fill="none" stroke="#F2F5FF" stroke-width="2"/>

  <g class="fade a3">
    <rect x="670" y="212" width="120" height="30" rx="15" fill="#FFD23F"/>
    <text class="sans" x="730" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#16247A">Say hello</text>
  </g>

  <g class="fade a2" fill="#16247A" stroke="#FFD23F" stroke-width="1.5">
    <rect x="664" y="206" width="132" height="42" fill="none" stroke-dasharray="4 3"/>
    <rect x="660.5" y="202.5" width="7" height="7"/>
    <rect x="792.5" y="202.5" width="7" height="7"/>
    <rect x="660.5" y="244.5" width="7" height="7"/>
    <rect x="792.5" y="244.5" width="7" height="7"/>
  </g>

  <text class="mono fade a4" x="650" y="284" font-size="15" fill="#F2F5FF" fill-opacity=".8">&lt;Button&gt;Say hello&lt;/Button&gt;</text>
</svg>
